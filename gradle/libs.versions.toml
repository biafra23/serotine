# Toolchain pins. Kotlin and Compose MIRROR biafra23/myotis's
# (gradle/libs.versions.toml there) on purpose: Serotine embeds the Myotis engine
# library, and one known-good Kotlin/Compose stack shared by the two repositories
# means the library's Kotlin metadata never runs ahead of the host's compiler.
# Bump both together.
[versions]
# AGP 8.13 (with Gradle 8.14, gradle/wrapper): its R8 understands Kotlin 2.2
# metadata. Myotis's AGP 8.7.3 does not — D8 prints a 200-line "error occurred
# when parsing kotlin metadata" stack trace per dexed class — and Myotis already
# runs 8.13.2's lint for the same reason (its gradle.properties). AGP 8.13 is the
# last 8.x line; 9.x changes the KMP Android target to its own plugin, a
# migration for both repositories at once.
agp = "8.13.2"
# Kotlin 2.2.21 is the floor for the iOS target on Xcode 26 (Myotis's reason to
# pin it); Compose Multiplatform 1.9.x pairs with Kotlin 2.2.20+.
kotlin = "2.2.21"
compose-multiplatform = "1.9.3"
# The multiplatform lifecycle (ViewModel + collectAsStateWithLifecycle). 2.9.6 is
# the version Compose Multiplatform 1.9.3's own artifacts depend on — pin the
# same so the two never resolve apart.
lifecycle = "2.9.6"
activity-compose = "1.9.3"
kotlinx-coroutines = "1.10.2"
# desugar_jdk_libs 2.1.5: the minSdk-29 JDK-API budget in CLAUDE.md was verified
# against this release's config.
desugar-jdk-libs = "2.1.5"
# Multiplatform navigation: JetBrains' build of androidx.navigation. 2.9.2 is the
# release built against Compose Multiplatform 1.9.3 and lifecycle 2.9.6, the two
# pins above, so nothing in its graph resolves past them.
navigation-compose = "2.9.2"
# The Material icons stopped at 1.7.3 upstream; Compose Multiplatform 1.9.x still
# consumes that release (material3 no longer brings it along).
material-icons-core = "1.7.3"
# ACINQ's Kotlin Multiplatform binding of bitcoin-core's libsecp256k1: JNI on
# Android and the JVM, cinterop on iOS — the native secp256k1 that
# docs/keys-and-signing.md (rule 7) requires. 0.22.0 is the last release built with
# Kotlin 2.2.21, our pin; 0.23.0 moves its stdlib to 2.3.
secp256k1-kmp = "0.22.0"
# The persistent account list (eth.serotine.data.account): multiplatform file I/O and
# JSON. kotlinx-io 0.8.2 and kotlinx-serialization 1.9.0 are the last releases built
# for Kotlin 2.2 (the next ones need a 2.3 stdlib); the serialization compiler plugin
# is Kotlin's own, at the Kotlin pin.
kotlinx-io = "0.8.2"
kotlinx-serialization = "1.9.0"
# The key envelope's Argon2id (docs/keys-and-signing.md, rule 2), from libsodium (the
# owner's choice, 2026-10-16). The bindings ship libsodium for Android (an AAR), the
# desktop JVM (macOS universal, Linux x64/arm64, Windows x64) and iOS; the envelope
# calls crypto_pwhash through its own byte-array JNA mapping instead of the bindings'
# String API (eth.serotine.data.keys.Sodium explains why). Built against Kotlin 1.9.23.
libsodium = "0.9.5"
# JNA, which libsodium is reached through on Android and the JVM: compiled against only
# (the bindings bring it at runtime, as the JNA AAR on Android). 5.18.1 is exactly the
# version the Myotis engine library pins with a strict constraint: the two move together.
jna = "5.18.1"
# The embedded Myotis engine (docs/embedding-myotis.md), from the filtered `maven-repo`
# repository in settings.gradle.kts. One version for the engine and the desktop's
# eth.myotis:myotis-engine-natives-<platform> (desktop-app/build.gradle.kts): a host library
# from another release would load and run that release's engine without a word.
myotis = "0.1.18"
# KotlinCrypto: pure-Kotlin multiplatform digests and MACs (Keccak-256 for
# addresses, SHA-256 for the BIP-39 checksum, HMAC-SHA512 for BIP-39/BIP-32).
# 0.8.0 needs a Kotlin 2.2.20 stdlib, below our pin.
kotlincrypto = "0.8.0"

[plugins]
android-application    = { id = "com.android.application",                 version.ref = "agp" }
android-library        = { id = "com.android.library",                     version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android",            version.ref = "kotlin" }
kotlin-jvm             = { id = "org.jetbrains.kotlin.jvm",                version.ref = "kotlin" }
kotlin-multiplatform   = { id = "org.jetbrains.kotlin.multiplatform",      version.ref = "kotlin" }
compose-compiler       = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }
compose-multiplatform  = { id = "org.jetbrains.compose",                   version.ref = "compose-multiplatform" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing",   version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "kotlinx-coroutines" }
kotlinx-io-core            = { module = "org.jetbrains.kotlinx:kotlinx-io-core",            version.ref = "kotlinx-io" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# org.jetbrains.androidx.*: JetBrains' multiplatform builds of the AndroidX lifecycle
# artifacts (the androidx.* coordinates are Android-only).
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }
androidx-activity-compose  = { module = "androidx.activity:activity-compose",            version.ref = "activity-compose" }
desugar-jdk-libs           = { module = "com.android.tools:desugar_jdk_libs",            version.ref = "desugar-jdk-libs" }
navigation-compose         = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
# The multiplatform BackHandler; already in every build through navigation-compose.
compose-ui-backhandler     = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
material-icons-core        = { module = "org.jetbrains.compose.material:material-icons-core",   version.ref = "material-icons-core" }
# The secp256k1 API, plus one JNI binding per JVM platform (see data/build.gradle.kts).
secp256k1-kmp              = { module = "fr.acinq.secp256k1:secp256k1-kmp",             version.ref = "secp256k1-kmp" }
secp256k1-kmp-jni-android  = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-android", version.ref = "secp256k1-kmp" }
secp256k1-kmp-jni-jvm      = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm",     version.ref = "secp256k1-kmp" }
libsodium-bindings         = { module = "com.ionspin.kotlin:multiplatform-crypto-libsodium-bindings", version.ref = "libsodium" }
jna                        = { module = "net.java.dev.jna:jna",                         version.ref = "jna" }
myotis-engine              = { module = "eth.myotis:myotis-engine",                     version.ref = "myotis" }
# Not "myotis-engine-ios": an alias that extends another (myotis-engine) turns that one
# into a group, which the build files would then have to read with asProvider().
myotis-ios                 = { module = "eth.myotis:myotis-engine-ios",                 version.ref = "myotis" }
kotlincrypto-sha2          = { module = "org.kotlincrypto.hash:sha2",                   version.ref = "kotlincrypto" }
kotlincrypto-sha3          = { module = "org.kotlincrypto.hash:sha3",                   version.ref = "kotlincrypto" }
kotlincrypto-hmac-sha2     = { module = "org.kotlincrypto.macs:hmac-sha2",              version.ref = "kotlincrypto" }
