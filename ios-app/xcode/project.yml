# XcodeGen spec for the iOS app: a SwiftUI shell around SerotineKit, the :ios-app Kotlin/Native
# framework (the composition root, the shared Compose UI, the Myotis engine). The generated
# Serotine.xcodeproj is not committed; generate it with
#   brew install xcodegen
#   cd ios-app/xcode && SEROTINE_DEVELOPMENT_TEAM=<team id> xcodegen generate
# The team id (Xcode > Settings > Accounts) signs the app for a device; without it the app
# builds for the simulator, and the team can be picked in Xcode's Signing & Capabilities tab.
name: Serotine
options:
  bundleIdPrefix: eth.serotine
  deploymentTarget:
    iOS: "15.2"
  createIntermediateGroups: true
targets:
  Serotine:
    type: application
    platform: iOS
    sources:
      - Serotine
    info:
      path: Serotine/Info.plist
      properties:
        CFBundleDisplayName: Serotine
        # Placeholders: the "Stamp the version" phase below writes the release version and build
        # number from the root build (the one pin, root build.gradle.kts) into the built Info.plist.
        CFBundleShortVersionString: "0.0.0"
        CFBundleVersion: "0"
        UILaunchScreen: {}
        # One window: the screen protections (:ui's ScreenCapture.ios.kt) follow the app's
        # active state, which with several scenes would not be each window's.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Compose Multiplatform refuses to start without it (its own render loop's frame rate).
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The engine dials devp2p and libp2p peers directly, which on a device can include
        # peers on the local network.
        NSLocalNetworkUsageDescription: >-
          Serotine's light client connects to Ethereum peers, which can include nodes on your
          local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eth.serotine
        DEVELOPMENT_TEAM: ${SEROTINE_DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        # Where :ios-app:embedAndSignAppleFrameworkForXcode stages SerotineKit.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # A static framework: the frameworks its archives call into are named here, since
        # auto-linking cannot see into them. Security: the Secure Enclave and the system's
        # randomness; SystemConfiguration: the engine's network-interface watching (libp2p);
        # UserNotifications: the upgrade notices.
        OTHER_LDFLAGS: >-
          $(inherited) -framework SerotineKit -framework Security -framework SystemConfiguration
          -framework UserNotifications
        # The Gradle phase writes outside Xcode's sandbox (the build directories).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
        # SerotineKit has the Apple-silicon simulator only (the targets Myotis's iOS module has).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    preBuildScripts:
      # One Gradle run: the framework, and the release version the last phase stamps.
      - name: Build SerotineKit (Gradle)
        script: |
          set -euo pipefail
          cd "$SRCROOT/../.."
          mkdir -p "$DERIVED_FILE_DIR"
          ./gradlew :ios-app:embedAndSignAppleFrameworkForXcode :printReleaseVersion | tee "$DERIVED_FILE_DIR/gradle.out"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Stamp the version
        script: |
          set -eu
          out="$DERIVED_FILE_DIR/gradle.out"
          version=$(sed -n 's/.*releaseVersion=\([0-9][0-9.]*\).*/\1/p' "$out" | tail -n1)
          build=$(sed -n 's/.*releaseBuildNumber=\([0-9][0-9]*\).*/\1/p' "$out" | tail -n1)
          if [ -z "$version" ] || [ -z "$build" ]; then
            echo "error: the Gradle phase printed no release version ($out)"
            exit 1
          fi
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$plist"
        basedOnDependencyAnalysis: false
schemes:
  Serotine:
    build:
      targets:
        Serotine: all
    run:
      config: Debug
