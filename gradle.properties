# Required by the Compose / Activity artifacts pulled in by :android-app.
android.useAndroidX=true

# Dexing the AndroidX + Compose classpath overflows the default 512m heap.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# KGP 2.2's tested AGP range stops short of 8.13; the combination works.
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true

# The shared modules declare the iOS targets from day one, so nothing
# JVM-only creeps into commonMain before the iOS host exists. Kotlin/Native
# can only build them on macOS; on Linux and Windows those targets are
# disabled, and this keeps the build quiet about it instead of warning on
# every invocation.
kotlin.native.ignoreDisabledTargets=true

kotlin.code.style=official
