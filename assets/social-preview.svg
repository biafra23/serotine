<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub social preview, in the layout of Myotis's (biafra23/myotis, assets/). This file
       is the source; the PNG beside it is what gets uploaded, by hand, under Settings >
       General > Social preview.

       Regenerate the PNG after editing this file:
         rsvg-convert -w 2560 -h 1280 -b white assets/social-preview.svg -o /tmp/p@2x.png
         magick /tmp/p@2x.png -resize 1280x640 -strip assets/social-preview.png
       (ImageMagick 7; on ImageMagick 6 the second command is `convert`.)

       FONTS — read before regenerating. The <text> below is live text, not outlines, so the
       render depends on the fonts installed on the machine doing it. The committed PNG was
       rendered on macOS, where the stack resolves to Helvetica Neue. Linux ships none of the
       three families, and fontconfig substitutes Nimbus Sans for Helvetica and Liberation Sans
       for Arial, with different metrics: regenerate on macOS, or eyeball the result before
       committing it. (Kept as text rather than outlined on purpose: the copy on this card is
       the part that changes, and outlines would make every wording change an unreviewable
       wall of path data.) -->
  <rect width="1280" height="640" fill="#FFFFFF"/>
