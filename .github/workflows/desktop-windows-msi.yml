name: Desktop MSI (Windows)

# The Windows installer: an x64 .msi that jpackage builds with WiX 3 on a
# Windows runner, then installs, launches and uninstalls there as a smoke test,
# and that the release job attaches to the tag's release.
#
# x64 only. Windows 11 on ARM runs it through its x64 emulation (Prism), which
# is also how a Windows VM on an Apple Silicon Mac runs it. A native arm64 msi
# would need the windows-11-arm runner and an arm64 JDK.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # Path-filtered, unlike the dmg. A Windows packaging leg on every PR would
  # cost more than it tells (the reason desktop-linux-deb.yml has no PR trigger
  # at all), but a change to the packaging should prove the msi before it
  # merges. Base branches stay unscoped (CLAUDE.md, "Multi-PR plans"); the
  # review gate's `if` below skips a PR whose base is not main, as for the other
  # artifact builds.
  pull_request:
    paths:
      - ".github/workflows/desktop-windows-msi.yml"
      - "desktop-app/build.gradle.kts"
      - "desktop-app/src/main/kotlin/eth/serotine/desktop/Main.kt"
      - "build.gradle.kts"
      - "gradle/libs.versions.toml"
  # Any branch, on demand from the Actions tab.
  workflow_dispatch:

# Cancel a superseded run when new commits land on the same branch/PR. The
# event is part of the group so a dispatch on main does not cancel an
# in-flight merge-to-main run (same reasoning as desktop-dmg.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Holds the build until this PR's Claude review has finished, like the dmg
  # and APK builds (see wait-for-claude-review.yml). Its `if:` must stay true
  # on every non-pull_request event: skipping it skips the build too.
  review-gate:
    name: Review gate
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    uses: ./.github/workflows/wait-for-claude-review.yml
    permissions:
      actions: read

  build:
    needs: review-gate
    name: Build Windows .msi (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MSI_DIR: desktop-app/build/compose/binaries/main/msi

    steps:
      # Git for Windows checks text files out with CRLF by default. The bash
      # steps below run ./gradlew, whose shebang line would then end in \r, and
      # the packaged app should carry the same bytes as the dmg and deb.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: :ui stamps the app's on-screen version from the
          # nearest v* tag (see desktop-dmg.yml for the details).
          fetch-depth: 0

      - name: Set up JDK 21 (x64)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64

      # JDK 21's jpackage builds an msi with WiX 3 (candle.exe + light.exe on
      # the PATH); WiX 4+ support arrived in a later jpackage. Installed from
      # the pinned upstream zip rather than relying on the runner image, whose
      # tool list changes between Windows Server versions.
      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $sha = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($got -ne $sha) {
            Write-Output "::error::wix314-binaries.zip has sha256 $got, expected $sha"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          Write-Output "WiX candle.exe $((Get-Item (Join-Path $dir 'candle.exe')).VersionInfo.FileVersion) at $dir"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compose Desktop's packageMsi wraps jpackage (jlink'd JRE + app → .msi).
      # The Gradle toolchain is pinned to the JDK setup-java installed, as in
      # the dmg workflow, so the bundled runtime is that x64 JDK and not one of
      # the image's preinstalled ones. Unsigned (SmartScreen warns on first run).
      # The release version the msi must declare is recorded for the verify
      # step, from the same query the release tag guard makes.
      - name: Build Windows .msi (x64)
        run: |
          GRADLE_ARGS=(
            -Porg.gradle.java.installations.auto-detect=false
            -Porg.gradle.java.installations.auto-download=false
            "-Porg.gradle.java.installations.paths=$JAVA_HOME"
          )
          built=
          for attempt in 1 2 3; do
            if ./gradlew :desktop-app:packageMsi --stacktrace "${GRADLE_ARGS[@]}"; then built=1; break; fi
            echo "::warning::MSI build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          [ -n "$built" ] || { echo "::error::MSI build failed after 3 attempts"; exit 1; }
          # The marker anywhere in the output, as release-version-guard.yml reads it:
          # even under -q a cold runner's wrapper download progress reaches stdout
          # without a trailing newline, so it need not start a line.
          version=$(./gradlew -q :printReleaseVersion "${GRADLE_ARGS[@]}" | tr -d '\r' | sed -n 's/.*releaseVersion=\([0-9][0-9.]*\).*/\1/p' | tail -n1)
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::could not read the release version (got '$version')"; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      # Compose names the output Serotine-<packageVersion>.msi; rename it to the
      # arch-tagged name, like the dmgs and debs. Exactly one, or fail.
      - name: Tag .msi with architecture
        run: |
          set -eu
          shopt -s nullglob
          msis=("$MSI_DIR"/*.msi)
          [ "${#msis[@]}" -eq 1 ] \
            || { echo "::error::expected exactly 1 msi, found ${#msis[@]}: ${msis[*]}"; exit 1; }
          mv "${msis[0]}" "$MSI_DIR/Serotine-x64.msi"

      # The build goes green on "BUILD SUCCESSFUL" alone, so check what the msi
      # actually carries: an administrative install unpacks it without
      # installing. The launcher and the bundled JVM must be x64 PE images, and
      # the Property table must hold the honest version and the pinned upgrade
      # code (without it, a newer msi installs beside the old one instead of
      # upgrading it).
      - name: Verify .msi contents
        shell: pwsh
        run: |
          function Fail([string]$msg) { Write-Output "::error::$msg"; exit 1 }
          function Get-PeMachine([string]$path) {
            $fs = [System.IO.File]::OpenRead($path)
            try {
              $br = [System.IO.BinaryReader]::new($fs)
              [void]$fs.Seek(0x3C, 'Begin')
              [void]$fs.Seek($br.ReadInt32(), 'Begin')
              if ($br.ReadUInt32() -ne 0x00004550) { Fail "$path is not a PE image" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          function Get-MsiProperty($installer, [string]$msi, [string]$name) {
            $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property='$name'"))
            [void]$view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $rec) { return $null }
            return $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1))
          }

          $msi = (Resolve-Path "$env:MSI_DIR/Serotine-x64.msi").Path
          $ex = Join-Path $env:RUNNER_TEMP 'msi-extract'
          # The extract's log goes where the smoke step's logs go, so it is uploaded on failure too.
          $smoke = (New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'msi-smoke')).FullName
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$ex`"", '/l*v', "`"$smoke\msi-extract.log`"")
          if ($p.ExitCode -ne 0) { Fail "administrative extract (msiexec /a) exited $($p.ExitCode) (msi-extract.log is in the smoke artifact)" }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $version = Get-MsiProperty $installer $msi 'ProductVersion'
          $upgrade = Get-MsiProperty $installer $msi 'UpgradeCode'
          Write-Output "ProductVersion=$version UpgradeCode=$upgrade"
          if ($version -ne $env:RELEASE_VERSION) { Fail "msi ProductVersion '$version' is not the release version '$env:RELEASE_VERSION'" }
          # The code from desktop-app/build.gradle.kts (`windows { upgradeUuid }`), copied here
          # ON PURPOSE: that value must never change, and a second copy makes a change fail
          # here instead of silently orphaning every installed msi. WiX stores it braced and
          # upper-case, and -ne compares case-insensitively.
          if ("$upgrade".Trim('{', '}') -ne 'a7691ec4-0334-46d8-8160-599a8dcdbd18') { Fail "msi UpgradeCode '$upgrade' is not the pinned one" }

          foreach ($name in 'Serotine.exe', 'jvm.dll') {
            $hits = @(Get-ChildItem -Path $ex -Recurse -File -Filter $name)
            if ($hits.Count -ne 1) { Fail "expected exactly one $name in the msi, found $($hits.Count)" }
            $machine = Get-PeMachine $hits[0].FullName
            Write-Output ("{0}: PE machine 0x{1:X4} ({2})" -f $name, $machine, $hits[0].FullName.Substring($ex.Length))
            if ($machine -ne 0x8664) { Fail ("{0} is PE machine 0x{1:X4}, not x64 (0x8664)" -f $name, $machine) }
          }
          Write-Output "OK: x64 msi $version carries an x64 launcher and JVM"

      # Install the msi the way a user would (per user, no admin prompt), start
      # the installed app, require that it is still running a while later, and
      # that it uninstalls cleanly.
      - name: Install, launch and uninstall smoke
        shell: pwsh
        run: |
          function Fail([string]$msg) { Write-Output "::error::$msg"; exit 1 }
          # Collected for upload by the next step (same path there).
          $env:SMOKE_DIR = Join-Path $env:RUNNER_TEMP 'msi-smoke'
          New-Item -ItemType Directory -Force -Path $env:SMOKE_DIR | Out-Null
          $msi = (Resolve-Path "$env:MSI_DIR/Serotine-x64.msi").Path
          # perUserInstall puts the app in %LOCALAPPDATA%\<packageName> (no admin
          # prompt); menuGroup and shortcut add the two links. All three must be
          # absent before the install, so finding them afterwards proves this msi
          # put them there.
          $exe = Join-Path $env:LOCALAPPDATA 'Serotine\Serotine.exe'
          $menuLink = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Serotine\Serotine.lnk'
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Serotine.lnk'
          foreach ($f in $exe, $menuLink, $desktopLink) {
            if (Test-Path $f) { Fail "$f exists before the install — not a fresh runner" }
          }

          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', "`"$msi`"", '/qn', '/l*v', "`"$env:SMOKE_DIR\install.log`"")
          if ($p.ExitCode -ne 0) { Fail "msiexec /i exited $($p.ExitCode) (install.log is in the smoke artifact)" }

          foreach ($f in $exe, $menuLink, $desktopLink) {
            if (-not (Test-Path $f)) {
              # Say where things did land, so a layout change is a one-run fix.
              Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles, "$env:APPDATA\Microsoft\Windows\Start Menu",
                  ([Environment]::GetFolderPath('Desktop')) -Include 'Serotine.exe', 'Serotine*.lnk' -Recurse -Depth 4 -File -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Output "found: $($_.FullName)" }
              Fail "the install did not create $f"
            }
          }
          Write-Output "OK: installed per user at $exe, with Start menu and desktop shortcuts"

          $app = Start-Process -FilePath $exe -PassThru
          # Without a handle taken while it runs, ExitCode reads empty once it has exited.
          $null = $app.Handle
          try {
            # Still running a while later: a crash at start-up (a missing JDK module
            # in the jlink image, a Compose/skiko load failure) shows up here.
            Start-Sleep -Seconds 30
            if ($app.HasExited) { Fail "Serotine exited (code $($app.ExitCode)) within 30s of starting" }
            Write-Output "OK: still running 30s after launch"

            # Best effort: what the desktop shows, for a human to look at.
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = [System.Drawing.Bitmap]::new($b.Width, $b.Height)
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save((Join-Path $env:SMOKE_DIR 'screenshot.png'))
            } catch { Write-Output "::warning::no desktop screenshot: $($_.Exception.Message)" }
          } finally {
            # It may exit on its own between the check and the stop.
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue; $app.WaitForExit(30000) | Out-Null }
          }

          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/x', "`"$msi`"", '/qn', '/l*v', "`"$env:SMOKE_DIR\uninstall.log`"")
          if ($p.ExitCode -ne 0) { Fail "msiexec /x exited $($p.ExitCode) (uninstall.log is in the smoke artifact)" }
          foreach ($f in $exe, $menuLink, $desktopLink) {
            if (Test-Path $f) { Fail "$f is still there after the uninstall" }
          }
          Write-Output "OK: installed, ran and uninstalled cleanly"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serotine-desktop-msi-smoke-x64-${{ github.sha }}
          path: ${{ runner.temp }}/msi-smoke
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      # Also when the verify or smoke step failed, so a failing installer can be
      # tried on a real Windows machine or VM; a red run marks it as one.
      - name: Upload MSI
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: serotine-desktop-msi-x64-${{ github.sha }}
          path: ${{ env.MSI_DIR }}/Serotine-x64.msi
          # Missing is an error on a green run; after a failed build there is none.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 30
          # Artifacts are immutable per run; a re-run would 409 without this.
          overwrite: true

  # Refuse to publish when the pushed tag disagrees with the version in the tree
  # (see release-version-guard.yml); the verify step above already proved the
  # msi declares that version.
  version-guard:
    name: Release version guard
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-version-guard.yml

  # Attach the msi to the GitHub Release for the pushed tag, once the smoke
  # above has passed. The other artifact workflows publish to the SAME release;
  # the create step tolerates that race.
  release:
    name: Publish msi to release
    needs: [build, version-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the msi
        uses: actions/download-artifact@v4
        with:
          name: serotine-desktop-msi-x64-${{ github.sha }}
          path: msi

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          printf '%s' "$tag" | grep -Eq '^v[A-Za-z0-9._-]+$' \
            || { echo "::error::'$tag' is not a valid release tag (expected v<version>)"; exit 1; }
          test -f msi/Serotine-x64.msi || { echo "::error::missing msi/Serotine-x64.msi"; exit 1; }
          mv msi/Serotine-x64.msi "msi/Serotine-${tag}-x64.msi"
          notes=$(mktemp)
          cat > "$notes" <<'NOTES'
          Pre-release build of the Serotine wallet apps.

          **Android (`*-android.apk`)** — the Serotine app, signed with Serotine's own release key
          (its certificate's SHA-256 is in `android-app/release-signing-cert.sha256` in the
          repository). Install via "Install unknown apps" and switch that off again afterwards;
          only ever install Serotine, and its updates, from this releases page.

          **Android debug (`*-android-debug.apk`)** — a separate test app ("Serotine Debug", amber
          icon, package `eth.serotine.debug`), signed with the publicly known debug key: anyone can
          build an APK that installs over it as an update, so never keep an account you use in it.
          It installs next to the release app.

          **Desktop macOS (`Serotine-v<version>-<arch>.dmg`)** — unsigned; download the dmg matching
          your Mac (arm64 for Apple Silicon, x64 for Intel). First launch:
          right-click → Open to get past Gatekeeper (not notarized yet).

          **Desktop Linux (`Serotine-v<version>-<arch>.deb`)** — install with
          `sudo apt install ./Serotine-v<version>-<arch>.deb`.

          **Desktop Windows (`Serotine-v<version>-x64.msi`)** — unsigned; per-user install, no
          administrator rights needed. SmartScreen warns on the first run.
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --prerelease \
              --title "Serotine $tag" \
              --notes-file "$notes" \
              --target "${GITHUB_SHA}" \
            || gh release view "$tag" >/dev/null 2>&1
          fi
          gh release upload "$tag" "msi/Serotine-${tag}-x64.msi" --clobber
