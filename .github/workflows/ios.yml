name: iOS

# The shared modules' iOS targets, which only a Mac builds (Kotlin/Native): Build and Test
# (ci.yml) runs on Linux, where they are disabled. This compiles :domain, :data and :ui for
# the device and the simulator and runs the common tests on the simulator, so iOS code is
# checked on every PR, not first when the iOS app is built.

on:
  push:
    branches: [ "main" ]
  # pull_request unscoped (any base branch), like ci.yml: a part PR of a multi-PR plan
  # targets its feature branch and still needs the check (CLAUDE.md, "Multi-PR plans").
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS targets (compile + simulator tests)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # :ui stamps the app's version from the nearest v* tag (git describe).
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The simulator tests run commonTest on iosSimulatorArm64 (the runner is Apple
      # silicon); the device target is compiled, which links nothing yet.
      - name: Compile and test the iOS targets
        # Retried like ci.yml's build, for transient repository-resolution blips (this job
        # resolves the iOS engine's klibs from the maven-repo branch cold).
        run: |
          for attempt in 1 2 3; do
            ./gradlew --stacktrace \
              :domain:iosSimulatorArm64Test \
              :data:iosSimulatorArm64Test \
              :data:compileKotlinIosArm64 \
              :ui:iosSimulatorArm64Test \
              :ui:compileKotlinIosArm64 && exit 0
            echo "::warning::Gradle attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::Gradle failed after 3 attempts"
          exit 1
