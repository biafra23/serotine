name: Android APK

on:
  # Scope push to main + release tags so a branch push that also has an open PR
  # doesn't build twice (the PR is covered by pull_request below). Tags still
  # build the release .apk.
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # pull_request stays unscoped (any base branch) so every PR shows this
  # workflow's checks — but the JOBS below skip a PR whose base is not main
  # (CLAUDE.md, "Multi-PR plans"): a part PR of a multi-PR plan targets its
  # feature branch, and building two APKs for each part costs more than it
  # tells; the final feature → main PR builds everything. Tests and the Claude
  # review stay on every PR (ci.yml, claude-review.yml). A part that touches
  # the minSdk budget can still run this on demand from the Actions tab
  # (workflow_dispatch) — note that check_apk_min_api.py, the minSdk-29
  # enforcement, runs in this workflow and nowhere else.
  pull_request:
  workflow_dispatch:

# Cancel a superseded run when new commits land on the same branch/PR. The
# event is part of the group because a dispatch shares refs with push runs
# (the Actions UI offers main and the tags): without it, a dispatch on main
# cancels an in-flight merge-to-main run, and one on a v* tag cancels that
# tag's run mid-release-upload. A dispatch on a v* tag is the release-republish
# path.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Holds the build until this PR's Claude review has finished, so it does not
  # run on a commit the review might still ask to change. It passes straight
  # through on every other event — see wait-for-claude-review.yml.
  review-gate:
    name: Review gate
    # Everything below needs this job, so skipping it here skips the build too
    # (a dependent job is skipped when a needed job was, unless its `if` uses
    # always()) — and on a tag the release uploads. So an `if:` on this job
    # MUST be true on every non-pull_request event (push to main, v* tags,
    # dispatch); the only safe test is the PR's base branch, which is all this
    # one does. The release jobs only run on tags.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    uses: ./.github/workflows/wait-for-claude-review.yml
    permissions:
      actions: read

  # Builds BOTH apps every run: the debug one (eth.serotine.debug, public debug
  # key) and the UNSIGNED release one (eth.serotine). The release APK is signed
  # only on a v* tag, by sign-release below, so the release key never meets this
  # job's Gradle build. ci.yml's `./gradlew build` already assembles both
  # variants on every PR; what this job adds is the min-API gate on the APKs
  # that actually ship and a signing rehearsal.
  build:
    name: Build APKs (debug + unsigned release)
    needs: review-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # 'true' when the tree pins a release certificate. On a tag, sign-release
      # runs only then; without a pin the tag publishes the debug APK alone.
      release-cert: ${{ steps.cert.outputs.present }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: :ui stamps the app's on-screen version from the nearest
          # v* tag, and `git describe` needs HEAD's history to REACH that tag.
          #
          # KNOWN GAP on pull_request: checkout defaults to github.ref, which for
          # that event is the ephemeral refs/pull/<n>/merge commit — so a PR-built
          # artifact stamps a sha that resolves nowhere. Deliberately not pinned to
          # the PR head: that would change WHAT is built (head, not head-merged-into-
          # base) and lose the integration signal.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The ubuntu-latest runner ships an Android SDK via $ANDROID_HOME, which
      # AGP picks up automatically when local.properties is absent.
      #
      # Retry to ride out transient external-repo resolution blips. NOT --offline:
      # offline turns a single cache miss into a hard failure.
      - name: Build the debug + unsigned release APKs
        run: |
          for attempt in 1 2 3; do
            ./gradlew :android-app:assembleDebug :android-app:assembleRelease --stacktrace && exit 0
            echo "::warning::APK build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::APK build failed after 3 attempts"
          exit 1

      # minSdk JDK-API gate — enforcement for CLAUDE.md's "minSdk 29 JDK-API
      # budget"; the script's docstring is the full story. The platform install
      # feeds its api-versions canary: pre-36.1 databases don't record every
      # policed API, and the script refuses to scan against a database that old
      # (exit 2). Both APKs ship, and each variant is dexed on its own, so both
      # are scanned.
      - name: Verify minSdk JDK-API compatibility
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" \
            || echo "::warning::sdkmanager could not install platforms;android-36.1 — the gate's own database canary will decide"
          for variant in debug release; do
            apk=$(ls android-app/build/outputs/apk/$variant/*.apk | head -n1)
            python3 scripts/check_apk_min_api.py --apk "$apk"
          done

      # Compose's ui-tooling, which renders :ui's previews in Android Studio, declares an
      # EXPORTED PreviewActivity that runs whatever composable an intent names.
      # android-app/build.gradle.kts keeps it out of every APK; this catches anything
      # that brings it back (a Compose bump that re-arranges artifacts, a dependency on
      # ui-tooling-android) from the merged manifest, the APK's ground truth. Fail-closed:
      # a dump without the app's own activity is refused rather than passed.
      - name: Verify no Compose preview tooling in the APKs
        run: |
          set -euo pipefail
          # Numbered stable releases only (not rc builds or a `current` symlink).
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ \
            | grep -E '/[0-9]+\.[0-9]+\.[0-9]+/$' | sort -V | tail -n1)
          for variant in debug release; do
            apk=$(ls android-app/build/outputs/apk/$variant/*.apk | head -n1)
            manifest=$("${build_tools}aapt2" dump xmltree --file AndroidManifest.xml "$apk")
            grep -qF '"eth.serotine.android.MainActivity"' <<<"$manifest" \
              || { echo "::error::could not read the $variant APK's manifest (no MainActivity in the aapt2 dump)"; exit 1; }
            if grep -F 'androidx.compose.ui.tooling' <<<"$manifest"; then
              echo "::error::the $variant APK declares Compose preview tooling (ui-tooling's exported PreviewActivity); see android-app/build.gradle.kts"
              exit 1
            fi
            echo "ok: $variant APK declares no Compose preview tooling"
          done

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-${{ github.sha }}
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          # Artifacts are immutable per run; without this, "re-run all jobs" on a
          # tag 409s in the build leg and the release job never runs. That is the
          # button people reach for after the version guard fails, so the recovery
          # path must not wedge the release.
          overwrite: true

      # sign_release_apk.sh otherwise first runs on a hosted runner at a real
      # tag. Rehearse it on every run with a throwaway key, so runner-image drift
      # (which build-tools dir it picks, apksigner's --alignment-preserved,
      # aapt2's badging format, the JDK behind apksigner) fails here instead.
      # The throwaway pin goes in through ANDROID_RELEASE_CERT_PIN_FILE, so the
      # committed pin is never read or touched.
      - name: Rehearse release signing with a throwaway key
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/sign-rehearsal"
          mkdir -p "$t"
          export REHEARSAL_PW=$(openssl rand -hex 24)
          keytool -genkeypair -keystore "$t/k.p12" -storetype PKCS12 -alias rehearsal \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Serotine signing rehearsal" \
            -storepass:env REHEARSAL_PW >/dev/null 2>&1
          keytool -list -v -keystore "$t/k.p12" -alias rehearsal -storepass:env REHEARSAL_PW \
            | sed -n 's/.*SHA256: //p' > "$t/pin"
          apk=$(ls android-app/build/outputs/apk/release/*.apk | head -n1)
          ANDROID_RELEASE_CERT_PIN_FILE="$t/pin" \
          ANDROID_RELEASE_KEYSTORE_BASE64="$(base64 -w0 "$t/k.p12")" \
          ANDROID_RELEASE_KEYSTORE_PASSWORD="$REHEARSAL_PW" \
          ANDROID_RELEASE_KEY_ALIAS=rehearsal \
            scripts/sign_release_apk.sh "$apk" "$t/signed.apk"
          rm -rf "$t"

      # Without a pinned release certificate a tag skips sign-release and
      # publishes the debug APK alone. Say so on every earlier run, while there
      # is still time to commit the pin.
      - name: Warn when no release certificate is pinned
        id: cert
        run: |
          if [ -f android-app/release-signing-cert.sha256 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No pinned release certificate::android-app/release-signing-cert.sha256 is missing, so a v* tag cut from this tree would publish the debug APK only, no release app (docs/android-release-signing.md)"
          fi

      # Only a tag needs it (sign-release below): an unsigned APK installs nowhere,
      # so on a PR or main it would only be dead artifact storage.
      - name: Upload the unsigned release APK
        if: startsWith(github.ref, 'refs/tags/v') && steps.cert.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-release-unsigned-${{ github.sha }}
          path: android-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true  # same re-run reason as the debug APK above

  # Refuse to publish when the pushed tag disagrees with the version in the tree
  # — the asset name below comes from the tag, the versionName inside the apk
  # comes from project.version. See release-version-guard.yml. Runs in parallel
  # with the build, so a mismatch is reported early rather than after the build.
  version-guard:
    name: Release version guard
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-version-guard.yml

  # Sign the release APK with the Serotine release key. The ONLY job that ever
  # holds that key, so it is kept as small as it can be (docs/android-release-signing.md):
  #   - the secrets live in the `android-release` ENVIRONMENT, not the repo, and
  #     that environment's deployment rule admits v* tags only, so no PR branch,
  #     whatever workflow it carries, can read them;
  #   - it checks out only the signing script and the pinned certificate, and runs
  #     apksigner from the runner's SDK: no Gradle, no plugin executes while the
  #     key is on disk;
  #   - it gets a read-only token, and publishing (contents: write) is a separate
  #     job that never sees the key.
  # Skipped when the tree pins no certificate (no release app yet: the tag
  # publishes the debug APK alone). With a pin it fails closed: with no secrets
  # or a key that does not match the pin, nothing is signed and the release job
  # below is skipped, so the tag publishes no Android asset at all rather than
  # a debug-signed one.
  # Its actions are pinned to commit SHAs, unlike the rest of the repo: the
  # runner hands a job every secret it references when the job STARTS, so each
  # action here runs while the key is readable from the runner process (how the
  # tj-actions/changed-files compromise, CVE-2025-30066, took secrets from jobs
  # that never passed them to it). A moved tag must not reach this job.
  sign-release:
    name: Sign the release APK
    needs: [build, version-guard]
    # A tree with no pinned certificate has no release app to sign (the build
    # job's warning): the tag then publishes the debug APK alone. With a pin,
    # this job must succeed or the tag publishes no Android APK at all.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.release-cert == 'true'
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read
    steps:
      - name: Check out the signing script and the pinned certificate only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          sparse-checkout: |
            scripts/sign_release_apk.sh
            android-app/release-signing-cert.sha256
          sparse-checkout-cone-mode: false
          # Nothing here talks to git again: keep the token out of .git/config.
          persist-credentials: false

      - name: Download the unsigned release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: android-app-release-unsigned-${{ github.sha }}
          path: unsigned

      - name: Sign with the release key and check the signer against the pin
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(unsigned/*.apk)
          [ "${#apks[@]}" -eq 1 ] \
            || { echo "::error::expected exactly 1 unsigned apk, found ${#apks[@]}: ${apks[*]}"; exit 1; }
          mkdir signed
          scripts/sign_release_apk.sh "${apks[0]}" signed/android-app-release.apk

      - name: Upload the signed release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: android-app-release-${{ github.sha }}
          path: signed/android-app-release.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true  # same re-run reason as the build job's artifacts

  # Attach both APKs to the GitHub Release for the pushed tag: the release-signed
  # app (Serotine-<tag>-android.apk) and the debug one (Serotine-<tag>-android-debug.apk).
  # A tree with no pinned release certificate publishes the debug APK alone.
  # Runs ONLY on `v*` tags (never on branch/PR builds), and reuses the artifacts
  # rather than rebuilding. The desktop workflows publish to the SAME release for
  # the same tag; whichever job runs first creates it and the others just upload
  # their assets — the create step below tolerates that race.
  release:
    name: Publish APKs to release
    # version-guard runs exactly on the tags this job runs for. sign-release is skipped
    # on a tag only when the tree pins no release certificate, and then this job
    # publishes the debug APK alone; a pin whose signing fails publishes nothing
    # (fail closed: a broken key is not quietly turned into a debug-only release).
    # !cancelled() lets this job run past that one skip; every other failure or
    # skip above it, and a cancelled run, still stops it.
    needs: [build, sign-release, version-guard]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success'
      && needs.version-guard.result == 'success'
      && (needs.sign-release.result == 'success'
          || (needs.sign-release.result == 'skipped' && needs.build.outputs.release-cert != 'true'))
    runs-on: ubuntu-latest
    permissions:
      # gh release create/upload needs write access to Releases (repo contents).
      contents: write
    steps:
      - name: Download the debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-app-debug-${{ github.sha }}
          path: apk/debug

      - name: Download the signed release APK
        if: needs.sign-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-app-release-${{ github.sha }}
          path: apk/release

      - name: Check the APKs' package ids and give them stable, versioned asset names
        env:
          SIGNED: ${{ needs.sign-release.result == 'success' }}
        run: |
          set -euo pipefail
          # The tag goes into the asset file names, so check its shape the way the
          # desktop publish jobs do. `gh release upload` reads everything after a
          # `#` in a path as the asset's label, and the version guard accepts any
          # v<version>-<suffix>, so a tag like v<version>-rc#1 would otherwise
          # create the release in the next step and then fail its upload.
          printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[A-Za-z0-9._-]+$' \
            || { echo "::error::'${GITHUB_REF_NAME}' is not a valid release tag (expected v<version>)"; exit 1; }
          # Numbered stable releases only (not rc builds or a `current` symlink).
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ \
            | grep -E '/[0-9]+\.[0-9]+\.[0-9]+/$' | sort -V | tail -n1)
          aapt2="${build_tools}aapt2"
          shopt -s nullglob
          # variant, expected package, asset suffix. The package check is the
          # point of shipping two APKs: the debug-signed one must never carry the
          # release app's id, or it would install over Serotine as an update for
          # anyone who uninstalled the release app (and a lookalike signed with the
          # same public key could follow).
          while read -r variant package suffix; do
            # Glob into an array and assert exactly one apk — a stray second file
            # (or zero) should fail here, not silently ship an arbitrary pick.
            apks=(apk/$variant/*.apk)
            [ "${#apks[@]}" -eq 1 ] \
              || { echo "::error::expected exactly 1 $variant apk, found ${#apks[@]}: ${apks[*]}"; exit 1; }
            got=$("$aapt2" dump packagename "${apks[0]}" < /dev/null)  # not the loop's stdin
            [ "$got" = "$package" ] \
              || { echo "::error::the $variant APK is package '$got', expected '$package'"; exit 1; }
            mv "${apks[0]}" "apk/Serotine-${GITHUB_REF_NAME}-${suffix}.apk"
            echo "  ok: $variant = $package -> Serotine-${GITHUB_REF_NAME}-${suffix}.apk"
          done < <(
            if [ "$SIGNED" = true ]; then echo "release eth.serotine android"; fi
            echo "debug eth.serotine.debug android-debug"
          )

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — gh must be told the repo explicitly or it
          # dies with "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # Notes via a quoted heredoc + --notes-file: markdown stays literal
          # (no shell escaping of backticks/quotes) and renders as intended.
          notes=$(mktemp)
          cat > "$notes" <<'NOTES'
          Pre-release build of the Serotine wallet apps.

          **Android (`*-android.apk`)**, in a release that has it — the Serotine app, signed with
          Serotine's own release key (its certificate's SHA-256 is in
          `android-app/release-signing-cert.sha256` in the repository). A release without it carries
          only the debug app below. Install via "Install unknown apps" and switch that off again afterwards;
          only ever install Serotine, and its updates, from this releases page.

          **Android debug (`*-android-debug.apk`)** — a separate test app ("Serotine Debug", amber
          icon, package `eth.serotine.debug`), signed with the publicly known debug key: anyone can
          build an APK that installs over it as an update, so never keep an account you use in it.
          It installs next to the release app.

          **Desktop macOS (`Serotine-v<version>-<arch>.dmg`)** — unsigned; download the dmg matching
          your Mac (arm64 for Apple Silicon, x64 for Intel). First launch:
          right-click → Open to get past Gatekeeper (not notarized yet).

          **Desktop Linux (`Serotine-v<version>-<arch>.deb`)** — install with
          `sudo apt install ./Serotine-v<version>-<arch>.deb`.

          **Desktop Windows** — not in this release: the embedded engine has no Windows build yet.
          NOTES
          # Create the release if it doesn't exist yet. A desktop workflow may win
          # this race for the same tag: if `create` fails, re-check with `view` —
          # success there means the other job already created it (fine), while a
          # genuine failure still surfaces because `view` also fails.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --prerelease \
              --title "Serotine $tag" \
              --notes-file "$notes" \
              --target "${GITHUB_SHA}" \
            || gh release view "$tag" >/dev/null 2>&1
          fi
          gh release upload "$tag" apk/Serotine-*.apk --clobber
